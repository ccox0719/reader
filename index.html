<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Workout</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #111;
–surface: #1c1c1c;
–border: #2a2a2a;
–text: #f0f0f0;
–muted: #666;
–d1: #c0392b;
–d2: #1a6b9a;
–d3: #2d7a4a;
}

body {
background: var(–bg);
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
overflow-x: hidden;
}

.topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 20px 20px 0;
}
.app-name {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.1rem;
letter-spacing: 0.12em;
color: var(–muted);
}
.pip-row { display: flex; gap: 6px; align-items: center; }
.pip {
width: 8px; height: 8px;
border-radius: 50%;
background: var(–border);
transition: background 0.3s;
}
.pip.d1 { background: var(–d1); }
.pip.d2 { background: var(–d2); }
.pip.d3 { background: var(–d3); }

.hero { padding: 28px 20px 16px; }
.up-next {
font-size: 0.68rem;
font-weight: 600;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 5px;
}
.day-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: clamp(2.8rem, 13vw, 4.5rem);
letter-spacing: 0.04em;
line-height: 0.9;
transition: color 0.3s;
}
.day-sub {
font-size: 0.82rem;
color: var(–muted);
margin-top: 8px;
font-weight: 500;
}

/* EXERCISE LIST */
.ex-list {
padding: 0 20px;
display: flex;
flex-direction: column;
gap: 3px;
flex: 1;
}

.ex-card {
background: var(–surface);
border-radius: 10px;
padding: 14px 16px;
display: flex;
align-items: center;
gap: 12px;
border: 1.5px solid var(–border);
cursor: pointer;
transition: background 0.15s;
-webkit-tap-highlight-color: transparent;
}
.ex-card:active { background: #242424; }
.ex-card.done { opacity: 0.4; }

.ex-num {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.4rem;
color: var(–muted);
width: 22px;
flex-shrink: 0;
line-height: 1;
}
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-weight: 600; font-size: 0.92rem; line-height: 1.2; }
.ex-detail { font-size: 0.73rem; color: var(–muted); margin-top: 2px; }
.ex-muscle {
font-size: 0.6rem;
font-weight: 600;
letter-spacing: 0.1em;
text-transform: uppercase;
padding: 2px 7px;
border-radius: 20px;
flex-shrink: 0;
}
.ex-check {
width: 28px; height: 28px;
border-radius: 50%;
border: 2px solid var(–border);
background: none;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
font-size: 0.8rem;
color: transparent;
transition: all 0.2s;
flex-shrink: 0;
-webkit-tap-highlight-color: transparent;
}
.ex-card.done .ex-check {
border-color: var(–muted);
color: var(–muted);
background: #2a2a2a;
}
.ex-hint {
font-size: 0.6rem;
color: #444;
text-align: right;
padding: 4px 20px 0;
letter-spacing: 0.05em;
}

/* DONE BUTTON */
.done-btn-wrap { padding: 16px 20px 36px; }
.done-btn {
width: 100%;
padding: 18px;
border-radius: 14px;
border: none;
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.4rem;
letter-spacing: 0.1em;
cursor: pointer;
color: #fff;
transition: all 0.2s;
}
.done-btn:active { transform: scale(0.97); }

/* COMPLETE SCREEN */
.complete-screen {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
flex: 1;
padding: 40px 20px;
text-align: center;
}
.complete-screen.show { display: flex; }
.complete-icon { font-size: 4rem; margin-bottom: 16px; }
.complete-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 2.5rem;
letter-spacing: 0.06em;
margin-bottom: 8px;
}
.complete-sub { font-size: 0.9rem; color: var(–muted); margin-bottom: 28px; line-height: 1.5; }
.next-preview {
background: var(–surface);
border: 1.5px solid var(–border);
border-radius: 12px;
padding: 14px 18px;
width: 100%;
max-width: 320px;
text-align: left;
margin-bottom: 24px;
}
.next-preview-label {
font-size: 0.65rem;
font-weight: 600;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 6px;
}
.next-preview-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.3rem;
letter-spacing: 0.05em;
}
.next-preview-exes { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.next-preview-ex { font-size: 0.78rem; color: var(–muted); }
.back-btn {
background: none;
border: 1.5px solid var(–border);
color: var(–muted);
border-radius: 10px;
padding: 12px 28px;
font-family: ‘DM Sans’, sans-serif;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
}

/* ── MODAL ── */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.75);
z-index: 100;
display: flex;
align-items: flex-end;
opacity: 0;
pointer-events: none;
transition: opacity 0.25s;
}
.modal-overlay.open {
opacity: 1;
pointer-events: all;
}
.modal {
background: #1e1e1e;
border-radius: 20px 20px 0 0;
width: 100%;
max-height: 80vh;
overflow-y: auto;
padding: 20px 20px 44px;
transform: translateY(30px);
transition: transform 0.28s ease;
}
.modal-overlay.open .modal { transform: translateY(0); }

.modal-handle {
width: 36px; height: 4px;
background: #3a3a3a;
border-radius: 2px;
margin: 0 auto 18px;
}
.modal-muscle {
font-size: 0.65rem;
font-weight: 600;
letter-spacing: 0.15em;
text-transform: uppercase;
margin-bottom: 4px;
}
.modal-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.8rem;
letter-spacing: 0.05em;
line-height: 1;
margin-bottom: 4px;
}
.modal-sets {
font-size: 0.78rem;
color: var(–muted);
margin-bottom: 18px;
}
.modal-steps-label {
font-size: 0.65rem;
font-weight: 600;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 10px;
}
.modal-steps { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.modal-steps li {
display: flex;
gap: 12px;
font-size: 0.9rem;
line-height: 1.5;
color: #ccc;
}
.step-n {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 0.9rem;
flex-shrink: 0;
width: 18px;
padding-top: 2px;
}
.modal-tip {
margin-top: 16px;
padding: 10px 12px;
background: #161208;
border-left: 3px solid;
border-radius: 0 6px 6px 0;
font-size: 0.82rem;
line-height: 1.45;
color: #b8a050;
}
.modal-tip strong { color: #e8c14a; }
.modal-done-btn {
margin-top: 20px;
width: 100%;
padding: 16px;
border-radius: 12px;
border: none;
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.2rem;
letter-spacing: 0.1em;
cursor: pointer;
color: #fff;
}
</style>

</head>
<body>

<div class="topbar">
  <div class="app-name">Next Workout</div>
  <div class="pip-row">
    <div class="pip" id="pip0"></div>
    <div class="pip" id="pip1"></div>
    <div class="pip" id="pip2"></div>
  </div>
</div>

<div id="workoutView" style="display:flex;flex-direction:column;flex:1;">
  <div class="hero">
    <div class="up-next">Up Next</div>
    <div class="day-title" id="dayTitle">—</div>
    <div class="day-sub" id="daySub">—</div>
  </div>
  <div class="ex-hint">Tap an exercise for how-to · Tap ○ to check off</div>
  <div class="ex-list" id="exList"></div>
  <div class="done-btn-wrap">
    <button class="done-btn" id="doneBtn">Mark Complete</button>
  </div>
</div>

<div class="complete-screen" id="completeScreen">
  <div class="complete-icon">💪</div>
  <div class="complete-title">Workout Done</div>
  <div class="complete-sub" id="completeSub"></div>
  <div class="next-preview" id="nextPreview"></div>
  <button class="back-btn" id="backBtn">Back to Today</button>
</div>

<!-- MODAL -->

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-muscle" id="mMuscle"></div>
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-sets" id="mSets"></div>
    <div class="modal-steps-label">How To Do It</div>
    <ol class="modal-steps" id="mSteps"></ol>
    <div class="modal-tip" id="mTip"></div>
    <button class="modal-done-btn" id="mDoneBtn">Got It</button>
  </div>
</div>

<script>
const DAYS = [
  {
    label: 'Day 1', focus: 'Press Focus', color: '#c0392b', pip: 'd1',
    exercises: [
      {
        name: 'Flat Dumbbell Press', muscle: 'Chest', sets: '3 × 10–12 · 60 sec rest',
        steps: [
          'Lie flat on the bench, feet planted on the floor.',
          'Hold a dumbbell in each hand at chest level, elbows at ~75° from body.',
          'Press both dumbbells straight up until arms are nearly locked out.',
          'Slowly lower back down in 2–3 seconds until you feel a chest stretch.',
          'Keep shoulder blades squeezed together throughout.'
        ],
        tip: "Don't let the dumbbells drift inward or outward — keep them stacked over your wrists."
      },
      {
        name: 'Seated Dumbbell Press', muscle: 'Shoulders', sets: '3 × 10–12 · 60 sec rest',
        steps: [
          'Set bench upright (90° or just under). Sit with back supported.',
          'Hold dumbbells at shoulder height, palms facing forward, elbows at 90°.',
          'Press both dumbbells straight up until arms are fully extended overhead.',
          'Lower slowly back to shoulder height.',
          "Don't arch your lower back — keep core braced and back against pad."
        ],
        tip: 'A slight forward lean of the bench (75–80°) reduces lower back strain.'
      },
      {
        name: 'One-Arm Dumbbell Row', muscle: 'Back', sets: '3 × 10–12 per arm · 60 sec rest',
        steps: [
          'Place one hand and same-side knee on the bench for support.',
          'Let the dumbbell hang from your working arm, fully extended, back flat.',
          'Pull the dumbbell up toward your hip — think elbow to ceiling.',
          'Squeeze your lat at the top, then lower fully.',
          'Your torso should not rotate. Keep it square to the floor.'
        ],
        tip: 'Drive the elbow, not the hand. Imagine the dumbbell is just attached to your elbow.'
      },
      {
        name: 'Dumbbell Curl', muscle: 'Biceps', sets: '3 × 12 · 60 sec rest',
        steps: [
          'Stand with dumbbells at your sides, palms facing forward.',
          'Curl both dumbbells up toward your shoulders by bending your elbows.',
          'Keep your upper arms still — elbows pinned to your sides.',
          'Squeeze your biceps at the top, then lower slowly.',
          "Don't swing your back — if you are, the weight is too heavy."
        ],
        tip: 'Lower in 3 seconds. The eccentric (lowering) phase builds just as much muscle.'
      }
    ]
  },
  {
    label: 'Day 2', focus: 'Pull Focus', color: '#1a6b9a', pip: 'd2',
    exercises: [
      {
        name: 'Incline Dumbbell Press', muscle: 'Chest', sets: '3 × 10–12 · 60 sec rest',
        steps: [
          'Set the bench to 30–45°. Higher angle hits more shoulder.',
          'Sit back with dumbbells resting on your thighs, then kick them up as you lie back.',
          'Press up from chest height, keeping elbows slightly tucked.',
          'Lower with control — go until upper arms are parallel to floor.',
          'Press explosively on the way up.'
        ],
        tip: '30° hits upper chest better than 45° — most people go too steep.'
      },
      {
        name: 'Bent-Over Row', muscle: 'Back', sets: '3 × 10–12 · 60 sec rest',
        steps: [
          'Stand with feet hip-width. Hinge forward at hips until torso is at 45–60° angle.',
          'Let dumbbells hang below chest, arms extended.',
          'Pull both dumbbells up to your sides — elbows drive back past your hips.',
          'Squeeze shoulder blades at the top, then lower with control.',
          "Keep back flat — don't round your lumbar spine."
        ],
        tip: "Start light until the hip hinge feels natural. Rounded back defeats the purpose."
      },
      {
        name: 'Lateral Raise', muscle: 'Shoulders', sets: '3 × 15 · 60 sec rest',
        steps: [
          'Stand or sit. Hold dumbbells at your sides with palms facing in.',
          'Raise both arms out to the sides in a wide arc until parallel to the floor.',
          'Lead with your elbows slightly above your wrists (as if pouring a pitcher).',
          'Lower slowly — 3 seconds down is ideal.',
          'Do NOT swing or use momentum. Use lighter weight than you think.'
        ],
        tip: 'Tilt the dumbbells slightly forward (pinky slightly higher than thumb) to better isolate side delts.'
      },
      {
        name: 'Overhead Tricep Ext.', muscle: 'Triceps', sets: '3 × 12 · 60 sec rest',
        steps: [
          'Sit on the bench or stand. Hold one dumbbell with both hands, cupped under the top plate.',
          'Press the dumbbell overhead fully, then lower it behind your head by bending elbows.',
          "Keep elbows pointing straight up — don't let them flare outward.",
          'Lower until you feel a tricep stretch, then press back up.',
          'Keep core tight to avoid lower back arching.'
        ],
        tip: 'The long head of the tricep (biggest part) is best stretched in this overhead position.'
      }
    ]
  },
  {
    label: 'Day 3', focus: 'Balanced', color: '#2d7a4a', pip: 'd3',
    exercises: [
      {
        name: 'Dumbbell Fly', muscle: 'Chest', sets: '3 × 12 · 60 sec rest',
        steps: [
          'Lie flat, dumbbells pressed up above chest with slight bend in elbows.',
          'Open your arms wide in an arc — like hugging a barrel — lowering until you feel a deep chest stretch.',
          'Keep the slight elbow bend constant throughout.',
          'Squeeze chest to bring arms back up in the same arc.',
          'Use lighter weight than pressing — this is an isolation move.'
        ],
        tip: "Think 'open and close' not 'press.' The pec stretch at the bottom is where the magic is."
      },
      {
        name: 'Chest-Supported Row', muscle: 'Back', sets: '3 × 12 · 60 sec rest',
        steps: [
          'Set bench to 30–45° incline. Lie face DOWN on it with chest on the pad.',
          'Let both dumbbells hang below you at arm\'s length.',
          'Row both dumbbells up simultaneously toward your hips, squeezing shoulder blades.',
          'Lower slowly all the way down.',
          'The bench removes lower back strain — great for pure back focus.'
        ],
        tip: "Keep your head in a neutral position — don't crane your neck up."
      },
      {
        name: 'Arnold Press', muscle: 'Shoulders', sets: '3 × 10 · 60 sec rest',
        steps: [
          'Start seated with dumbbells at shoulder level, palms facing YOU (like top of a curl).',
          'As you press up, rotate your wrists so palms face forward at the top.',
          'Lock out overhead, then reverse: rotate palms back inward as you lower.',
          'At the bottom, palms face you again. That\'s one rep.',
          'Slower rotation = more shoulder engagement.'
        ],
        tip: 'The rotation recruits all three deltoid heads — front, side, and rear.'
      },
      {
        name: 'Hammer Curl', muscle: 'Biceps', sets: '3 × 12 · 60 sec rest',
        steps: [
          'Stand with dumbbells at sides, palms facing YOUR BODY (neutral grip, like holding a hammer).',
          'Curl both arms up, keeping palms facing in throughout the entire movement.',
          'Upper arms stay still. Squeeze at the top.',
          'Lower slowly back to starting position.',
          'Also works the brachialis (outer arm thickness) and forearms.'
        ],
        tip: 'Alternate arms instead of both at once for more control and heavier weight.'
      }
    ]
  }
];

const MUSCLE_COLORS = { Chest:'#c0392b', Shoulders:'#e67e22', Back:'#1a6b9a', Biceps:'#8e44ad', Triceps:'#2d7a4a' };

function getState() {
  try { return JSON.parse(localStorage.getItem('nw2') || '{"day":0}'); } catch { return {day:0}; }
}
function saveState(s) { try { localStorage.setItem('nw2', JSON.stringify(s)); } catch {} }

let state = getState();
let checked = new Set();
let modalExIdx = null;

// ── RENDER ──
function render() {
  const idx = state.day % 3;
  const day = DAYS[idx];
  const next = DAYS[(idx + 1) % 3];

  document.querySelectorAll('.pip').forEach((p, i) => {
    p.className = 'pip' + (i === idx ? ` ${day.pip}` : '');
  });

  document.getElementById('dayTitle').textContent = day.label;
  document.getElementById('dayTitle').style.color = day.color;
  document.getElementById('daySub').textContent = `${day.focus} · 4 exercises · ~25 min`;
  document.getElementById('doneBtn').style.background = day.color;

  const list = document.getElementById('exList');
  list.innerHTML = '';
  day.exercises.forEach((ex, i) => {
    const mc = MUSCLE_COLORS[ex.muscle] || '#666';
    const card = document.createElement('div');
    card.className = 'ex-card' + (checked.has(i) ? ' done' : '');
    card.innerHTML = `
      <div class="ex-num">${i + 1}</div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-detail">${ex.sets.split('·')[0].trim()}</div>
      </div>
      <div class="ex-muscle" style="background:${mc}22;color:${mc}">${ex.muscle}</div>
      <button class="ex-check" data-i="${i}">${checked.has(i) ? '✓' : ''}</button>
    `;
    // Tap card body = open modal
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('ex-check') || e.target.closest('.ex-check')) return;
      openModal(i);
    });
    // Tap check = toggle done
    card.querySelector('.ex-check').addEventListener('click', (e) => {
      e.stopPropagation();
      if (checked.has(i)) checked.delete(i); else checked.add(i);
      render();
    });
    list.appendChild(card);
  });

  // complete preview
  document.getElementById('completeSub').textContent = `Next up is ${next.label} — ${next.focus}.`;
  document.getElementById('nextPreview').innerHTML = `
    <div class="next-preview-label">Coming Up</div>
    <div class="next-preview-title" style="color:${next.color}">${next.label} · ${next.focus}</div>
    <div class="next-preview-exes">
      ${next.exercises.map(e => `<div class="next-preview-ex">· ${e.name}</div>`).join('')}
    </div>`;
}

// ── MODAL ──
function openModal(exIdx) {
  const idx = state.day % 3;
  const ex = DAYS[idx].exercises[exIdx];
  const mc = MUSCLE_COLORS[ex.muscle] || '#666';
  modalExIdx = exIdx;

  document.getElementById('mMuscle').textContent = ex.muscle;
  document.getElementById('mMuscle').style.color = mc;
  document.getElementById('mTitle').textContent = ex.name;
  document.getElementById('mSets').textContent = ex.sets;
  document.getElementById('mSteps').innerHTML = ex.steps.map((s, i) =>
    `<li><span class="step-n" style="color:${mc}">${i+1}</span><span>${s}</span></li>`
  ).join('');
  document.getElementById('mTip').innerHTML = `<strong>💡 Tip:</strong> ${ex.tip}`;
  document.getElementById('mTip').style.borderColor = mc;
  document.getElementById('mDoneBtn').style.background = DAYS[idx].color;

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('mDoneBtn').addEventListener('click', () => {
  if (modalExIdx !== null) {
    checked.add(modalExIdx);
    render();
  }
  closeModal();
});

// ── COMPLETE ──
document.getElementById('doneBtn').addEventListener('click', () => {
  state.day++;
  saveState(state);
  checked.clear();
  document.getElementById('workoutView').style.display = 'none';
  document.getElementById('completeScreen').classList.add('show');
  render();
});

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('workoutView').style.display = 'flex';
  render();
});

render();
</script>

</body>
</html>
